<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Partida · Salón Arcade</title>
    <style>
      html,
      body {
        margin: 0;
        background: #101f2b;
        color: #fff;
        font: 15px system-ui;
        height: 100%;
      }
      #status {
        padding: 16px;
        margin: 0;
        position: absolute;
        z-index: 4;
        background: #172d3a;
        max-width: 90%;
      }
      #game,
      video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      video {
        display: none;
      }
      button {
        background: #f6ce53;
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        cursor: pointer;
        font: inherit;
      }
      #audio {
        min-width: 118px;
      }
      [hidden] {
        display: none !important;
      }
      #player-controls {
        position: absolute;
        inset: auto 0 0;
        z-index: 6;
        padding: 10px 12px;
        background: #101f2bf2;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      #player-controls label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #volume {
        width: 100px;
        accent-color: #f6ce53;
      }
      #player-controls button {
        font-size: 13px;
        padding: 8px 10px;
      }
      #playback-state {
        font-size: 11px;
        color: #c3d3df;
      }
      #connection-stats {
        flex-basis: 100%;
        font-size: 12px;
        color: #dce8f3;
      }
      body.remote-player {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
      }
      .remote-player #remote {
        min-height: 0;
      }
      .remote-player #player-controls {
        position: static;
      }
      #enable-audio {
        position: absolute;
        top: 70px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 7;
        min-height: 46px;
        box-shadow: 0 4px 20px #0005;
        white-space: nowrap;
      }
      #touch-controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        align-items: center;
        gap: 8px 18px;
        padding: 8px max(12px, env(safe-area-inset-right)) 12px
          max(12px, env(safe-area-inset-left));
        background: #101f2b;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      .touch-player.remote-player {
        grid-template-rows: minmax(120px, 1fr) auto auto;
      }
      .touch-player #remote {
        grid-row: 1;
      }
      .touch-player #touch-controls {
        grid-row: 2;
      }
      .touch-player #player-controls {
        grid-row: 3;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
      }
      .touch-player #gamepad-state {
        display: none;
      }
      .touch-player #player-controls {
        gap: 6px 10px;
      }
      .touch-system {
        grid-column: 1 / -1;
        display: flex;
        justify-content: center;
        gap: 12px;
      }
      .touch-system button {
        min-width: 82px;
        min-height: 44px;
        padding: 8px 12px;
        font-size: 13px;
        background: #263e50;
        color: #e7eff6;
        border: 1px solid #547084;
      }
      .touch-dpad {
        display: grid;
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 44px);
        gap: 2px;
        justify-self: start;
      }
      .touch-dpad button,
      .touch-dpad span {
        display: grid;
        place-items: center;
        padding: 0;
        background: #263e50;
        color: #e7eff6;
        border-radius: 8px;
        font-size: 22px;
      }
      .touch-dpad span {
        color: #7e9aaf;
        font-size: 20px;
      }
      .touch-dpad button[data-actions*=" "] {
        background: #1b3041;
        color: #9fb8cc;
        font-size: 18px;
      }
      .touch-actions {
        display: grid;
        grid-template-columns: repeat(2, 52px);
        grid-template-rows: repeat(2, 52px);
        gap: 10px;
        justify-self: end;
        transform: rotate(-8deg);
        padding: 6px;
      }
      .touch-actions button {
        padding: 0;
        border-radius: 50%;
        background: #dce7ef;
        color: #101f2b;
        font-weight: 800;
        font-size: 21px;
        border-bottom: 4px solid #a2bacb;
        transform: rotate(8deg);
      }
      .touch-actions button[data-actions="a"],
      .touch-actions button[data-actions="b"] {
        background: #f6ce53;
        border-color: #bd9633;
      }
      #touch-controls button.pressed {
        background: #316ad5;
        color: #fff;
        border-color: #6a9bf7;
        box-shadow: inset 0 0 0 2px #abcaff;
      }
      @media (max-width: 340px) {
        .touch-dpad {
          grid-template-columns: repeat(3, 40px);
          grid-template-rows: repeat(3, 40px);
        }
        .touch-actions {
          grid-template-columns: repeat(2, 48px);
          grid-template-rows: repeat(2, 48px);
          gap: 8px;
        }
        #touch-controls {
          column-gap: 8px;
          padding-inline: 10px;
        }
      }
      @media (orientation: landscape) and (min-width: 600px) {
        :fullscreen .touch-player {
          grid-template-columns: 160px minmax(0, 1fr) 160px;
          grid-template-rows: minmax(0, 1fr) auto;
        }
        :fullscreen .touch-player #remote {
          grid-column: 2;
          grid-row: 1;
        }
        :fullscreen .touch-player #touch-controls {
          grid-column: 1 / -1;
          grid-row: 1;
          grid-template-columns: 140px minmax(0, 1fr) 140px;
          padding: 12px;
          background: transparent;
          pointer-events: none;
        }
        :fullscreen .touch-player .touch-dpad {
          grid-column: 1;
          grid-row: 1;
          pointer-events: auto;
        }
        :fullscreen .touch-player .touch-actions {
          grid-column: 3;
          grid-row: 1;
          pointer-events: auto;
        }
        :fullscreen .touch-player .touch-system {
          display: contents;
        }
        :fullscreen .touch-player .touch-system button {
          grid-column: 1;
          grid-row: 1;
          align-self: end;
          justify-self: center;
          pointer-events: auto;
        }
        :fullscreen .touch-player .touch-system button:last-child {
          grid-column: 3;
        }
        :fullscreen .touch-player #player-controls {
          grid-column: 1 / -1;
          grid-row: 2;
        }
        :fullscreen .touch-player #playback-state {
          display: none;
        }
      }
      #remote:focus-visible,
      button:focus-visible,
      input:focus-visible {
        outline: 2px solid #f6ce53;
        outline-offset: -3px;
      }
      #game {
        outline: none;
      }
    </style>
  </head>
  <body>
    <p id="status">Conectando con la sala…</p>
    <div id="game" tabindex="0"></div>
    <video
      id="remote"
      autoplay
      playsinline
      controls
      muted
      tabindex="0"
      aria-label="Imagen del juego. Haz clic aquí para usar el teclado."
    ></video>
    <button id="enable-audio" type="button" hidden>Jugar con sonido</button>
    <div
      id="touch-controls"
      role="group"
      aria-label="Controles táctiles del juego"
      hidden
    >
      <div class="touch-system">
        <button
          type="button"
          data-actions="coin"
          aria-label="Crédito"
          aria-pressed="false"
        >
          Crédito
        </button>
        <button
          type="button"
          data-actions="start"
          aria-label="Inicio"
          aria-pressed="false"
        >
          Inicio
        </button>
      </div>
      <div class="touch-dpad" role="group" aria-label="Cruceta de dirección">
        <button
          type="button"
          data-actions="up left"
          aria-label="Arriba e izquierda"
          aria-pressed="false"
        >
          ↖
        </button>
        <button
          type="button"
          data-actions="up"
          aria-label="Arriba"
          aria-pressed="false"
        >
          ↑
        </button>
        <button
          type="button"
          data-actions="up right"
          aria-label="Arriba y derecha"
          aria-pressed="false"
        >
          ↗
        </button>
        <button
          type="button"
          data-actions="left"
          aria-label="Izquierda"
          aria-pressed="false"
        >
          ←
        </button>
        <span aria-hidden="true">✚</span>
        <button
          type="button"
          data-actions="right"
          aria-label="Derecha"
          aria-pressed="false"
        >
          →
        </button>
        <button
          type="button"
          data-actions="down left"
          aria-label="Abajo e izquierda"
          aria-pressed="false"
        >
          ↙
        </button>
        <button
          type="button"
          data-actions="down"
          aria-label="Abajo"
          aria-pressed="false"
        >
          ↓
        </button>
        <button
          type="button"
          data-actions="down right"
          aria-label="Abajo y derecha"
          aria-pressed="false"
        >
          ↘
        </button>
      </div>
      <div class="touch-actions" role="group" aria-label="Botones de acción">
        <button
          type="button"
          data-actions="c"
          aria-label="Botón C"
          aria-pressed="false"
        >
          C
        </button>
        <button
          type="button"
          data-actions="d"
          aria-label="Botón D"
          aria-pressed="false"
        >
          D
        </button>
        <button
          type="button"
          data-actions="a"
          aria-label="Botón A"
          aria-pressed="false"
        >
          A
        </button>
        <button
          type="button"
          data-actions="b"
          aria-label="Botón B"
          aria-pressed="false"
        >
          B
        </button>
      </div>
    </div>
    <div
      id="player-controls"
      role="group"
      aria-label="Controles del reproductor"
      hidden
    >
      <button id="audio" type="button" aria-pressed="false">
        Activar sonido
      </button>
      <label
        >Volumen
        <input
          id="volume"
          type="range"
          min="0"
          max="100"
          value="80"
          aria-label="Volumen del juego"
      /></label>
      <button id="fullscreen" type="button" aria-pressed="false">
        Pantalla completa
      </button>
      <button
        id="touch-toggle"
        type="button"
        aria-pressed="false"
        aria-controls="touch-controls"
      >
        Controles táctiles
      </button>
      <button
        id="diagnostics"
        type="button"
        aria-expanded="false"
        aria-controls="connection-stats"
      >
        Conexión
      </button>
      <span id="playback-state" role="status"></span>
      <span
        id="gamepad-state"
        style="font-size: 11px; color: #c3d3df"
        role="status"
        >Pulsa un botón del mando para detectarlo.</span
      >
      <output id="connection-stats" hidden>Midiendo la conexión…</output>
    </div>
    <script type="module" src="/src/player-entry.js"></script>
  </body>
</html>
